databaseChangeLog:
  - changeSet:
      id: 0
      author: pavel
      changes:
        - createTable:
            tableName: games
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: price
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false