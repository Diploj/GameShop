databaseChangeLog:
  - changeSet:
      id: 3
      author: pavel
      preConditions:
        - onFail: HALT
        - and:
            - tableExist: orders
            - tableExist: games
      changes:
        - createTable:
            tableName: ordered_games
            columns:
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: game_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: ordered_games
            columnNames: order_id,game_id
            constraintName: pk_ordered_games
        - addForeignKeyConstraint:
            baseTableName: ordered_games
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_order_ordered_games
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: ordered_games
            baseColumnNames: game_id
            referencedTableName: games
            referencedColumnNames: id
            constraintName: fk_game_ordered_games
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: ordered_games